name: Bug report
description: 报告页面、筛选或兼容性问题
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并删除截图中的个人信息和凭证。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么，期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 输入...
        3. 点击...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、操作系统和设备版本
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的截图或日志
    validations:
      required: false
